<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ingresar | MEJR Timesheet</title>

  <!-- Estilos de Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <!-- Nuestro archivo de estilos -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="js/app.js" defer></script>
</head>

<body class="bg-light">

  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
      <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">

        <!-- Nombre de la empresa -->
        <header class="mb-4">
          <p class="fw-bold mb-1">MEJR CONSULTING</p>
          <p class="text-secondary small mb-0">Registro de horas</p>
        </header>

        <!-- Pantalla de ingreso -->
        <section class="bg-white border rounded p-4">
          <h1 class="h4 mb-2">Iniciar sesión</h1>

          <p class="text-secondary small mb-4">
            Ingresa con el usuario asignado por administración.
          </p>

          <form id="login-form">
            <div class="mb-3">
              <label for="usuario" class="form-label">
                Usuario
              </label>

              <input
                type="text"
                class="form-control"
                id="usuario"
                name="usuario"
                autocomplete="username"
                required
              >
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">
                Contraseña
              </label>

              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
              >
            </div>

            <button
              type="button"
              id="ingresar"
              class="btn btn-dark w-100"
            >
              Ingresar
            </button>

            <div class="text-center mt-3">
              <button
                type="button"
                id="recuperar-password"
                class="btn btn-link text-secondary small"
              >
                Olvidé mi contraseña
              </button>
            </div>

            <p
              id="mensaje"
              class="small text-secondary mt-3 mb-0"
              role="status"
            ></p>
          </form>
        </section>

        <footer class="text-center text-secondary small mt-4">
          MEJR Consulting · Timesheet
        </footer>

      </div>
    </div>
  </main>

</body>
</html>
